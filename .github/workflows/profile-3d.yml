name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate and rotate 3D contribution graph

    steps:
      # 1. Get your repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Generate all 3D contribution graphs
      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 3. Choose today's graph
      - name: Select today's graph
        run: |
          DAY=$(date -u +%u)

          case $DAY in
            1)
              GRAPH="profile-green-animate.svg"
              ;;
            2)
              GRAPH="profile-season-animate.svg"
              ;;
            3)
              GRAPH="profile-south-season-animate.svg"
              ;;
            4)
              GRAPH="profile-night-view.svg"
              ;;
            5)
              GRAPH="profile-night-green.svg"
              ;;
            6)
              GRAPH="profile-night-rainbow.svg"
              ;;
            7)
              GRAPH="profile-gitblock.svg"
              ;;
          esac

          echo "Today's graph: $GRAPH"

          # Replace the active graph in README
          sed -i -E \
            's|!\[\]\(\./profile-3d-contrib/[^)]*\.svg\)|![](./profile-3d-contrib/'"$GRAPH"')|' \
            README.md

      # 4. Commit everything
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A .

          if git commit -m "Update daily 3D contribution graph"; then
            git push
          else
            echo "No changes to commit."
          fi
